<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Page</title>
</head>

<body>
    <button id="changebutton">Change Text</button>

    <p id="text">There is a Paragraph</p>

    <script type="text/javascript">
        document.getElementById("changebutton").onclick = function() {
            var numdevis;

            numdevis = Math.floor(Math.random() * 100000000); // display the number lowen than 1

            document.getElementById("text").innerHTML = numdevis;
        };
    </script>
</body>

</html>
