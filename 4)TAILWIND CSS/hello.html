  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-400 to-purple-600 flex items-center justify-center min-h-screen">

  <div class="bg-[rgba(255,255,255,0.2)] backdrop-blur-md border border-[rgba(255,255,255,0.3)] 
              p-6 rounded-xl shadow-lg w-80 text-center">
    <h1 class="text-2xl font-bold text-white">Glassmorphism Card</h1>
    <p class="mt-2 text-white/80">This card uses RGBA transparency and backdrop blur.</p>
    <button class="mt-4 px-4 py-2 rounded bg-gradient-to-r from-pink-500 to-yellow-500 text-white opacity-80 font-semibold hover:opacity-90 transition">
      Click Me
    </button>
  </div>

</body>
