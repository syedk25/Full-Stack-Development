<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Page</title>
</head>

<body>
    <button id="changebutton">Change Text</button>

    <p id="text">There is a Paragraph</p>

    <script type="text/javascript">
        function devis(a, b) {
            return a + b;
        }

        document.getElementById("changebutton").onclick = function() {
            var r1 = Math.floor(Math.random() * 1000000); // display the number lowen than 1

            var a = "Votre Devis Num :  DAKIRACADEMY";

            document.getElementById("text").innerHTML = devis(a, r1);
        };
    </script>
</body>

</html>
