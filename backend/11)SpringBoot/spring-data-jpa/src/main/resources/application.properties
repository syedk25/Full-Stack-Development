spring.application.name=spring-data-jpa

# connects to MySql on your computer using port 3306 & database student_db
spring.datasource.url=jdbc:mysql://localhost:3306/student_db

#dedicated database user name
spring.datasource.username=student_app

# user password of mysql
spring.datasource.password=123

# create missing table of your jpa and update schema when needed
spring.jpa.hibernate.ddl-auto=update

# print sql statement in terminal
spring.jpa.show-sql=true
